# Prometheus + Grafana inside the cluster.
# Before applying, create the dashboard ConfigMap:
#   kubectl -n heart-disease create configmap grafana-dashboards \
#     --from-file=monitoring/grafana/dashboards/
# Prometheus discovers every pod with the prometheus.io/scrape annotation.
apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: heart-disease}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: prometheus, namespace: heart-disease}
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: prometheus, namespace: heart-disease}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: heart-disease}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config, namespace: heart-disease}
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: heart-api-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [heart-disease]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: heart-disease}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{containerPort: 9090}]
          volumeMounts: [{name: config, mountPath: /etc/prometheus}]
      volumes:
        - name: config
          configMap: {name: prometheus-config}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: heart-disease}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-provisioning, namespace: heart-disease}
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - {name: Prometheus, uid: prometheus, type: prometheus, access: proxy,
         url: "http://prometheus:9090", isDefault: true}
  dashboards.yml: |
    apiVersion: 1
    providers:
      - {name: heart-api, folder: Heart Disease API, type: file,
         options: {path: /var/lib/grafana/dashboards}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: heart-disease}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          env:
            - {name: GF_SECURITY_ADMIN_PASSWORD, value: admin}
          ports: [{containerPort: 3000}]
          volumeMounts:
            - {name: prov, mountPath: /etc/grafana/provisioning/datasources/datasource.yml, subPath: datasource.yml}
            - {name: prov, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - name: prov
          configMap: {name: grafana-provisioning}
        - name: dashboards
          configMap: {name: grafana-dashboards}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: heart-disease}
spec:
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000}]
